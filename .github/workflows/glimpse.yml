name: Glimpse automatic optimization

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: glimpse-optimize-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  optimize-images:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install glimpse
        working-directory: ${{ runner.temp }}
        env:
          COMPOSER_HOME: ${{ runner.temp }}/glimpse-composer
        run: |
          composer global require --no-interaction --no-progress --no-plugins --no-scripts mathiasgrimm/glimpse-cli
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Check and optimize reported images
        shell: bash
        env:
          # Optional. Personal tokens provide higher limits.
          GLIMPSE_TOKEN: ${{ secrets.GLIMPSE_TOKEN }}
        run: |
          report="$RUNNER_TEMP/glimpse-check.json"

          # Save the list of images that need optimization.
          # Exit code 1 can mean images were found, so inspect the report below.
          check_status=0
          glimpse check . --json > "$report" || check_status=$?
          if [ "$check_status" -gt 1 ]; then
            echo "Image check failed with exit code $check_status."
            exit "$check_status"
          fi

          # Stop if any image could not be checked, or the report is invalid.
          if ! jq -e '.failed == []' "$report" > /dev/null; then
            echo "Image check failed. See the report below."
            cat "$report"
            exit 1
          fi

          # Read each reported filename safely, including spaces and newlines.
          # jq separates filenames with a null character; read uses the same separator.
          jq -j '.files[] | .file, "\u0000"' "$report" |
            while IFS= read -r -d '' file; do
              # Replace the original image, keeping its format and filename.
              glimpse optimize "./$file" --quality=85 --output="./$file" --force
            done

      - name: Open or update the optimization PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.pull_request.base.ref }}
          branch: automation/glimpse-${{ github.event.pull_request.base.ref }}
          title: Optimize images
          commit-message: Optimize images
          body: Optimize images reported by glimpse check, keeping their formats and filenames.
          delete-branch: true